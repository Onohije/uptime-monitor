name: Drift detection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.16.1

jobs:
  detect:
    name: Nightly plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::533267195508:role/uptime-monitor-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Plan and detect drift
        id: drift
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=drift.tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            terraform show -no-color drift.tfplan > drift.txt
          fi
          exit $([ "$code" = "1" ] && echo 1 || echo 0)

      - name: Open an issue if drift was found
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/drift.txt', 'utf8');
            const limit = 55000;
            if (plan.length > limit) plan = plan.slice(0, limit) + '\n\n... truncated.';

            const title = 'Infrastructure drift detected';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });

            const body = `Real infrastructure no longer matches \`main\`.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `<details><summary>Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift'],
              });
            }
